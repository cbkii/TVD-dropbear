name: TVD CI
on:
  push:
    branches: [master, dev]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends shellcheck
          shellcheck -S error -s sh module/*.sh module/common/*.sh module/tvddctl tests/*.sh
          shellcheck -S error -s bash scripts/build.sh scripts/build-bundles.sh scripts/preflight.sh
          bash scripts/preflight.sh
  native:
    needs: tests
    strategy:
      fail-fast: false
      matrix:
        abi: [armeabi-v7a, arm64-v8a]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends autoconf automake libtool make patch perl curl
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.0.12077973"
      - env:
          ABIS: ${{ matrix.abi }}
        run: |
          export NDK="$ANDROID_HOME/ndk/27.0.12077973"
          bash scripts/build.sh
          bash scripts/build-bundles.sh
          python3 scripts/package.py --abi "$ABIS"
      - uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b
        with:
          name: TVD-${{ matrix.abi }}
          path: dist/
          if-no-files-found: error

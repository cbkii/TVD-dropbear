name: TVD manual release
on:
  workflow_dispatch:
    inputs:
      channel:
        type: choice
        options: [testing, stable]
        default: testing
      qualified:
        description: 'Stable only: exact artifact and physical acceptance reviewed'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: tvd-release
  cancel-in-progress: false
jobs:
  build:
    if: github.ref_name == github.event.repository.default_branch
    strategy:
      matrix:
        abi: [armeabi-v7a, arm64-v8a]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: |
          bash scripts/preflight.sh
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends autoconf automake libtool make patch perl curl
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.0.12077973"
      - env:
          ABIS: ${{ matrix.abi }}
        run: |
          export NDK="$ANDROID_HOME/ndk/27.0.12077973"
          bash scripts/build.sh
          bash scripts/build-bundles.sh
          python3 scripts/package.py --abi "$ABIS"
      - uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b
        with:
          name: release-${{ matrix.abi }}
          path: dist/
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CHANNEL: ${{ inputs.channel }}
          QUALIFIED: ${{ inputs.qualified }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          (cd dist && sha256sum -c *.sha256)
          VERSION=$(sed -n 's/^version=//p' module/module.prop)
          if [ "$CHANNEL" = stable ]; then
            # A candidate must not be published as stable; stable promotion
            # must bind the reviewed physical artefact hash to its release.
            echo 'Stable release blocked until exact-artifact promotion and physical qualification implemented.'
            exit 1
          fi
          # Only a draft named testing is mutable. Never overwrite a published release.
          if gh release view testing --json isDraft > /tmp/tvd-release.json 2>/dev/null; then
            test "$(jq -r .isDraft /tmp/tvd-release.json)" = true
          else
            gh release create testing --draft --prerelease --target "$SOURCE_SHA" --title "TVD testing" --notes "Unqualified engineering builds"
          fi
          gh release edit testing --draft --target "$SOURCE_SHA" --notes "Source: $SOURCE_SHA. Testing only; physical qualification pending."
          gh release upload testing dist/* --clobber
          gh release view testing --json isDraft,assets,targetCommitish
